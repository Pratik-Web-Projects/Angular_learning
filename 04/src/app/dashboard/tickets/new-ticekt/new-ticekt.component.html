<form (ngSubmit)="onSubmit(titleInput)">
  <app-control label="Title">
    <input name="title" id="title" #titleInput/>
  </app-control>
    
  <app-control label="Request">
    <textarea name="request" id="request" rows="3">

    </textarea>
  </app-control>
    <button appButton>
        Submit
      <span ngProjectAs="icon">
        ⌲
      </span>
    </button>
</form>
